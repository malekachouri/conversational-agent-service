# Local stack: API + Postgres + Prometheus.
#   cp .env.example .env   # add ANTHROPIC_API_KEY (or set LLM_PROVIDER=mock)
#   docker compose up --build
services:
  api:
    build: .
    image: conversational-agent-service:local
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-medium}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent  # local development only
      POSTGRES_DB: agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

volumes:
  pgdata:
